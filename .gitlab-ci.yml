image: docker:latest

services:
  - docker:dind

stages:
  - build
  - release

variables:
  IMAGE_BUILD: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

before_script:
  - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"

after_script:
  - docker logout "$CI_REGISTRY"

build:
  stage: build
  script:
    - docker build --pull -t "$IMAGE_BUILD" .
    - docker push "$IMAGE_BUILD"

release-branch:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - docker pull "$IMAGE_BUILD"
    - docker tag "$IMAGE_BUILD" "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

release-tag:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9._-]+)?$/
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - docker pull "$IMAGE_BUILD"
    - docker tag "$IMAGE_BUILD" "$CI_REGISTRY_IMAGE:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE:$VERSION"
    - docker tag "$IMAGE_BUILD" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
